name: CI

on:
  push:
    branches: [master, "feature/*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: odata_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Ciclo 13 (DT02): type-check de tests y scripts (tsconfig.test.json).
      # Evita que el type-check de tests se rompa en silencio (Vitest no type-chequea).
      - run: npx tsc --noEmit --project tsconfig.test.json

      - run: pnpm test

      # Ciclo 16 (R5): smoke del arranque real de producción (dist). Detecta
      # roturas de `pnpm start` (p.ej. el ERR_UNSUPPORTED_DIR_IMPORT de R1) que
      # build + tests no cubren: levanta dist, verifica healthz, auth estricto
      # (401 sin token, login -> 200 con token) y mata el proceso.
      # F4 (R8): el smoke comparte `odata_dev` con los tests, que dejan el
      # esquema sincronizado (sync dev) + SequelizeMeta -> la migracion 002
      # (ALTER ADD COLUMN docNumber, no idempotente) fallaba y el server
      # abortaba. Se limpia el esquema antes de arrancar (arranque prod real
      # con migraciones desde cero, R2) y el usuario de humo se crea tras el
      # arranque (la tabla `users` nace con la migracion 004).
      - name: Smoke start (dist, modo produccion)
        run: |
          set -e
          node -e "const pg=require('pg');const c=new pg.Client({host:'localhost',port:5432,user:'postgres',password:'secret',database:'odata_dev'});c.connect().then(()=>c.query('DROP SCHEMA public CASCADE; CREATE SCHEMA public')).then(()=>{console.log('schema reset (smoke prod limpio)');process.exit(0)}).catch(e=>{console.error(e);process.exit(1)})"
          NODE_ENV=production SECRET_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
          CORS_ORIGIN=http://localhost DB_SSL=false DB_HOST=localhost DB_PORT=5432 \
          DB_USERNAME=postgres DB_PASSWORD=secret DB=odata_dev \
          node ./dist/server.js > /tmp/odata-smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz)" = "200"
          pnpm auth:create-user --username=ci-smoke --password=ci-smoke-1234
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/odata/product-odata)" = "401"
          TOKEN=$(curl -s -X POST http://localhost:3000/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"ci-smoke","password":"ci-smoke-1234"}' \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const t=JSON.parse(d).token;process.stdout.write(t||'')})")
          test -n "$TOKEN"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://localhost:3000/odata/product-odata)" = "200"
          kill $PID

      # Ciclo 17 (M3): gate de vulnerabilidades. Falla si `pnpm audit --prod`
      # reporta un advisory FUERA de la cadena conocida y documentada:
      #   - cadena de build de bcrypt (@mapbox/node-pre-gyp -> tar/rimraf/...):
      #     build-time, no runtime; mitigada por --frozen-lockfile (ciclo 17 D4).
      # Cualquier advisory nuevo (de otra ruta) rompe el pipeline.
      - name: Audit de dependencias (fail si hay advisories nuevos)
        run: |
          set -e
          pnpm audit --prod --json > /tmp/audit.json || true
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
            const known = (p) => p.includes('@mapbox/node-pre-gyp');
            const newOnes = [];
            for (const adv of Object.values(a.advisories || {})) {
              const paths = ((adv.findings || [])[0] || {}).paths || [];
              if (!paths.every(known)) newOnes.push(adv.moduleName + ' (' + adv.severity + ')');
            }
            if (newOnes.length) {
              console.error('ADVISORIES NUEVOS:', newOnes.join(', '));
              process.exit(1);
            }
            const n = Object.keys(a.advisories || {}).length;
            console.log('Audit OK: ' + n + ' advisory(ies) conocido(s) y documentado(s) (cadena build bcrypt, ciclo 17)');
          "

  # Ciclo 17 (R2): la imagen de produccion se construye en cada PR. El gate
  # Docker del ciclo 16 (F3) era manual; cualquier rotura del Dockerfile o del
  # stage production ahora falla el pipeline. Sin push (no hay registry).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen de produccion (target production)
        run: docker build --target production -t odata-server:ci .
